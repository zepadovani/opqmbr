# Workflow do GitHub Pages — caminho C de deploy (docs/DEPLOY.md).
#
# Este arquivo não roda aqui: é a fonte que `mirrar_site_github.sh` copia para
# `.github/workflows/deploy.yml` no repositório-espelho no GitHub. Ele fica
# nesta pasta (e não em `.github/workflows/` deste repositório) de propósito —
# este repositório é o Forgejo, com `sucupira_dados/raw/` versionado, e não deve
# nunca ser ele mesmo o que é espelhado para o GitHub.
#
# O pipeline reproduz, num runner efêmero, o que o Mac faz antes de `./deploy.sh`
# (docs/DEPLOY.md, caminho A): baixa o banco e os derivados de uma release
# privada do Forgejo, gera os JSON públicos, roda os mesmos guarda-corpos de PII,
# builda o Vite e publica só o `dist/`. O `sucupira.db` nunca é commitado aqui —
# existe só durante o job, num runner descartável.
#
# Publica no branch `gh-pages` (empurrado por push --force, sem histórico),
# igual a `publicar_site_github.sh` no dia a dia — os dois convergem no mesmo
# lugar, então o Pages fica configurado uma única vez como "branch: gh-pages",
# nunca como "Actions": as duas fontes competindo é o que causou o build
# silenciosamente não disparar da primeira vez (ver docs/DEPLOY.md).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # Sem o token, este job não tem como gerar dado real — e diferente da CI
      # do Forgejo (que só faz checagem de código), aqui a ausência do banco é
      # falha, não aviso: este workflow É o caminho de publicação.
      - name: Fetch database from Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_SERVIDOR: ${{ vars.FORGEJO_SERVIDOR || 'https://git.pdvn.cc' }}
          FORGEJO_REPO: ${{ vars.FORGEJO_REPO || 'padovani/baixarsucupira' }}
          BASE_RELEASE_TAG: ${{ vars.BASE_RELEASE_TAG }}
        run: ./baixar_base_ci.sh

      - name: Check database was fetched
        run: |
          if [ ! -f sucupira.db ]; then
            echo "::error::sucupira.db não foi baixado — configure o secret FORGEJO_TOKEN neste repositório GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Opcional: sem isto o Atlas (§4.2) sai vazio no site publicado, mas o
      # resto do build segue — baixar_derivados_ci.sh nunca falha por ausência.
      - name: Fetch Atlas precomputed artifacts from Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_SERVIDOR: ${{ vars.FORGEJO_SERVIDOR || 'https://git.pdvn.cc' }}
          FORGEJO_REPO: ${{ vars.FORGEJO_REPO || 'padovani/baixarsucupira' }}
          BASE_RELEASE_TAG: ${{ vars.BASE_RELEASE_TAG }}
        run: ./baixar_derivados_ci.sh

      - name: Build public data JSON from the database
        run: |
          python3 -m analise.indices
          python3 -m analise.build_public

      # Exatamente os dois guarda-corpos que ./deploy.sh exige do Mac antes de
      # publicar (nada de agencias/paises/idiomas/preparar_logos/malha_ibge —
      # esses são checagens de CI do Forgejo, não parte do gate de deploy, e
      # dependem de arquivos-fonte que este espelho não leva: logos/*.png e o
      # PNG de origem da malha do IBGE).
      - name: PII and comparable-core guardrails
        run: |
          python3 -m analise.nucleo --conferir
          python3 -m analise.pii_test --exigir-artefatos

      # GitHub Pages serve projeto sob subpath (`.../<repo>/`) — inclusive
      # quando a conta tem domínio custom herdado por outra Pages site, como
      # `pdvn.cc/<repo>/`. Sem isto, o HTML aponta pros assets na raiz do
      # domínio e 404. `github.event.repository.name` em vez do nome fixo,
      # para o workflow servir qualquer nome de repositório-espelho.
      - name: Build site
        working-directory: site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Publica igual a publicar_site_github.sh: commit único, force-pushed,
      # sem histórico — o gh-pages branch não é editado, é regenerado por
      # inteiro a cada publicação, do Mac ou daqui.
      - name: Publish dist/ to gh-pages
        working-directory: site/dist
        run: |
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "publish: ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      # Ver publicar_site_github.sh: alternar a fonte do Pages logo após um
      # push nem sempre dispara build sozinho. Idempotente, sem custo em rodar
      # sempre.
      - name: Ensure Pages serves gh-pages, and force a build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f "build_type=legacy" -f "source[branch]=gh-pages" -f "source[path]=/" \
            >/dev/null 2>&1 || true
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
